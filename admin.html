<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Dharma Kalvi Maiyam</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-white shadow border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="dkm logo.jpg" alt="Logo" class="h-12 w-12 object-contain rounded-full shadow">
                <div>
                    <h1 class="text-xl font-bold text-slate-900">Dharma Kalvi Maiyam</h1>
                    <p class="text-xs text-slate-500">Kundang Branch • Admin Dashboard</p>
                </div>
            </div>
            <div>
                <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white text-sm px-4 py-2 rounded-lg shadow transition">
                    🖨️ Print Report
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Filters & Stats -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-3 items-center">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Filter Role</label>
                    <select id="filterType" onchange="fetchLogs()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500">
                        <option value="all">All Roles</option>
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Filter Class</label>
                    <select id="filterClass" onchange="fetchLogs()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-500">
                        <option value="all">All Classes</option>
                        <option value="Tevaram Level 1">Tevaram Level 1</option>
                        <option value="Saivam & Philosophy">Saivam & Philosophy</option>
                        <option value="Tahap 1 (Standard 1, 2, 3)">Tahap 1 (Standard 1, 2, 3)</option>
                        <option value="Tahap 2 (Standard 4, 5, 6)">Tahap 2 (Standard 4, 5, 6)</option>
                        <option value="General">General</option>
                    </select>
                </div>
            </div>
            <div>
                <span id="recordCount" class="text-sm font-medium text-slate-600 bg-slate-100 px-3 py-2 rounded-lg">Total Records: 0</span>
            </div>
        </div>

        <!-- Attendance Table -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider border-b border-slate-200">
                            <th class="px-4 py-3">No.</th>
                            <th class="px-4 py-3">Role</th>
                            <th class="px-4 py-3">ID Number</th>
                            <th class="px-4 py-3">Full Name</th>
                            <th class="px-4 py-3">Class / Subject</th>
                            <th class="px-4 py-3">Method</th>
                            <th class="px-4 py-3">Timestamp</th>
                            <th class="px-4 py-3">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody" class="divide-y divide-slate-200 text-sm">
                        <!-- Dynamic Rows Will Load Here -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        async function fetchLogs() {
            const type = document.getElementById('filterType').value;
            const className = document.getElementById('filterClass').value;

            try {
                const response = await fetch(`/api/attendance?type=${type}&class_name=${encodeURIComponent(className)}`);
                const result = await response.json();

                if (result.success) {
                    const tbody = document.getElementById('attendanceTableBody');
                    tbody.innerHTML = '';
                    
                    document.getElementById('recordCount').innerText = `Total Records: ${result.data.length}`;

                    if (result.data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-slate-400">No attendance records found.</td></tr>`;
                        return;
                    }

                    result.data.forEach((row, index) => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-slate-50 transition";
                        tr.innerHTML = `
                            <td class="px-4 py-3 text-slate-500">${index + 1}</td>
                            <td class="px-4 py-3 font-medium uppercase text-xs">
                                <span class="px-2 py-1 rounded ${row.user_type === 'teacher' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">
                                    ${row.user_type}
                                </span>
                            </td>
                            <td class="px-4 py-3 font-mono">${row.student_id}</td>
                            <td class="px-4 py-3 font-semibold text-slate-800">${row.student_name}</td>
                            <td class="px-4 py-3 text-slate-600">${row.class_name}</td>
                            <td class="px-4 py-3 text-xs">
                                <span class="px-2 py-1 rounded bg-emerald-100 text-emerald-700">${row.entry_method}</span>
                            </td>
                            <td class="px-4 py-3 text-slate-500 text-xs">${row.timestamp}</td>
                            <td class="px-4 py-3">
                                <button onclick="deleteRecord(${row.id})" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1 rounded shadow transition">
                                    Delete
                                </button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) {
                console.error('Failed to load logs:', err);
            }
        }

        async function deleteRecord(id) {
            if (!confirm("Are you sure you want to delete this record?")) return;
            
            try {
                const response = await fetch(`/api/attendance/${id}`, { method: 'DELETE' });
                const result = await response.json();
                
                if (result.success) {
                    fetchLogs(); // Reload table data
                } else {
                    alert("Error deleting record: " + result.message);
                }
            } catch (err) {
                alert("Failed to delete record.");
            }
        }

        // Load logs on page load
        fetchLogs();
    </script>
</body>
</html>
