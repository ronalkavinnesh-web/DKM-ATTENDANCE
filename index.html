<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dharma Kalvi Maiyam - Check-In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col justify-between py-6 px-4">

    <!-- Header Branding -->
    <div class="w-full max-w-sm mx-auto text-center pt-2">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-2xl shadow-lg p-2 mb-3">
            <img src="dkm_logo.jpg" alt="DKM Logo" class="h-16 w-16 mx-auto object-contain mb-2">
        </div>
        <h2 class="text-xs text-amber-400 font-semibold uppercase tracking-wider">Malaysia Hindhudharma Maanandram</h2>
        <h1 class="text-xl font-bold text-white tracking-tight mt-0.5">Dharma Kalvi Maiyam</h1>
        <p class="text-xs text-slate-400 mt-0.5">Kundang Branch</p>
    </div>

    <!-- Check-In Form Card -->
    <div class="w-full max-w-sm mx-auto bg-white rounded-3xl shadow-2xl p-6 my-auto border border-slate-100">
        <div class="mb-5 text-center">
            <h2 class="text-lg font-semibold text-slate-900">Attendance Check-In</h2>
            <p class="text-xs text-slate-500">Select your role and submit details</p>
        </div>
        
        <form id="attendanceForm" class="space-y-4">
            <!-- Role Selection Toggle -->
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">I am a</label>
                <select id="user_type" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <option value="student">🎓 Student</option>
                    <option value="teacher">👨‍🏫 Teacher / Cikgu</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">ID Number</label>
                <input type="text" id="student_id" required 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition" 
                    placeholder="e.g. DKM-101 or T-01">
            </div>
            
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Full Name</label>
                <input type="text" id="student_name" required 
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white transition" 
                    placeholder="e.g. Kumar Ravi">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Class / Subject</label>
                <select id="class_name" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <option value="Tahap 2 (Std 4,5,6)">Tahap 2 (Standard 4, 5, 6)</option>
                    <option value="Tingkatan 1,2,3">Secondary (Tingkatan 1, 2, 3)</option>
                    <option value="Tingkatan 4,5">Secondary (Tingkatan 4 & 5)</option>
                    <option value="Hindhudharma Class">Hindhudharma Religious Class</option>
                </select>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full mt-2 bg-amber-500 text-slate-900 py-3.5 px-4 rounded-xl font-bold text-sm shadow-lg shadow-amber-500/20 hover:bg-amber-400 active:scale-[0.98] transition">
                Mark Present
            </button>
        </form>

        <div id="message" class="mt-4 text-center text-xs font-medium hidden p-3 rounded-xl"></div>
    </div>

    <div class="text-center text-slate-500 text-xs pb-1">
        &copy; 2026 Dharma Kalvi Maiyam Kundang
    </div>

    <script>
        document.getElementById('attendanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user_type = document.getElementById('user_type').value;
            const student_id = document.getElementById('student_id').value.trim();
            const student_name = document.getElementById('student_name').value.trim();
            const class_name = document.getElementById('class_name').value;
            const msgDiv = document.getElementById('message');
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerText = "Submitting...";

            try {
                const response = await fetch('/api/attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_type, student_id, student_name, class_name, entry_method: 'QR_SCAN' })
                });
                const result = await response.json();

                msgDiv.classList.remove('hidden');
                if (result.success) {
                    msgDiv.className = "mt-4 text-center text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 p-3 rounded-xl";
                    msgDiv.innerText = `✓ Success! Recorded as ${user_type.toUpperCase()}.`;
                    document.getElementById('attendanceForm').reset();
                } else {
                    msgDiv.className = "mt-4 text-center text-xs font-semibold text-rose-700 bg-rose-50 border border-rose-200 p-3 rounded-xl";
                    msgDiv.innerText = "✕ Error: " + result.message;
                }
            } catch (err) {
                msgDiv.classList.remove('hidden');
                msgDiv.className = "mt-4 text-center text-xs font-semibold text-rose-700 bg-rose-50 border border-rose-200 p-3 rounded-xl";
                msgDiv.innerText = "✕ Connection error. Please try again.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Mark Present";
            }
        });
    </script>
</body>
</html>
